services:
  rag:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env.runtime
    environment:
      ORACLE_WALLET_DIR: /run/oracle-wallet
    volumes:
      - ./wallet:/run/oracle-wallet:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=6).close()"]
      interval: 30s
      timeout: 8s
      start_period: 40s
